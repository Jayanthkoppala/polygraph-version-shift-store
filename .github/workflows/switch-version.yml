name: evolve-store

run-name: Evolve fixture generation ${{ inputs.generation }} for mission ${{ inputs.mission_id }}

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Next positive generation number
        required: true
        type: string
      parent_generation:
        description: Current generation this evolution starts from
        required: true
        type: string
      seed:
        description: Deterministic generation seed
        required: true
        type: string
      mission_id:
        description: Polygraph mission identifier
        required: true
        type: string

concurrency:
  group: fixture-production-evolution
  cancel-in-progress: false

jobs:
  evolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_GENERATION: ${{ inputs.generation }}
      PARENT_GENERATION: ${{ inputs.parent_generation }}
      GENERATION_SEED: ${{ inputs.seed }}
      MISSION_ID: ${{ inputs.mission_id }}
      LIVE_URL: ${{ vars.POLYGRAPH_FIXTURE_URL }}
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Validate the requested evolution
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_GENERATION" =~ ^[1-9][0-9]*$ ]]; then echo "generation must be a positive integer"; exit 1; fi
          if [[ ! "$PARENT_GENERATION" =~ ^[0-9]+$ ]]; then echo "parent_generation must be a non-negative integer"; exit 1; fi
          if [[ ! "$GENERATION_SEED" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]; then echo "seed has unsupported characters"; exit 1; fi
          if [[ -z "$MISSION_ID" ]]; then echo "mission_id is required"; exit 1; fi
          if [[ -z "$LIVE_URL" ]]; then echo "Repository variable POLYGRAPH_FIXTURE_URL is required"; exit 1; fi
          CURRENT_GENERATION=$(node -e "const m=require('./version.json');process.stdout.write(String(m.generation))")
          CURRENT_PARENT=$(node -e "const m=require('./version.json');process.stdout.write(String(m.parent_generation ?? ''))")
          CURRENT_SEED=$(node -e "const m=require('./version.json');process.stdout.write(String(m.seed ?? ''))")
          CURRENT_MISSION=$(node -e "const m=require('./version.json');process.stdout.write(String(m.mission_id ?? ''))")
          if [[ "$TARGET_GENERATION" == "$CURRENT_GENERATION" && "$PARENT_GENERATION" == "$CURRENT_PARENT" && "$GENERATION_SEED" == "$CURRENT_SEED" && "$MISSION_ID" == "$CURRENT_MISSION" ]]; then
            echo "This exact generation is already current; continuing to deployment proof."
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PARENT_GENERATION" != "$CURRENT_GENERATION" ]]; then echo "parent_generation must match live generation"; exit 1; fi
          if (( TARGET_GENERATION != CURRENT_GENERATION + 1 )); then echo "generation must advance exactly once"; exit 1; fi
          echo "already_current=false" >> "$GITHUB_OUTPUT"

      - name: Generate the next live product structure
        if: steps.validate.outputs.already_current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-generation.js --source versions/v2.html --output index.html --generation "$TARGET_GENERATION" --parent-generation "$PARENT_GENERATION" --seed "$GENERATION_SEED" --mission-id "$MISSION_ID" --parent-state version.json > /tmp/generation-manifest.json
          export PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const generated = JSON.parse(fs.readFileSync('/tmp/generation-manifest.json', 'utf8'));
          const commits = execFileSync('git', ['log', '--pretty=format:%H', '-n', '5'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          fs.writeFileSync('version.json', `${JSON.stringify({ version: 'evolving', ...generated, published_at: process.env.PUBLISHED_AT, cache: `generation-${generated.generation}-${generated.seed}`, commits }, null, 2)}\n`);
          NODE
          node scripts/smoke-fixture-check.js --generation "$TARGET_GENERATION" --parent-generation "$PARENT_GENERATION" --seed "$GENERATION_SEED" --mission-id "$MISSION_ID"

      - name: Commit the generated production state
        if: steps.validate.outputs.already_current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "chore(fixture): evolve generation ${TARGET_GENERATION} for ${MISSION_ID}"
          git push origin HEAD:main

      - name: Prove the Vercel production alias
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const selectorContains = (html, selector, value) => selector.startsWith('[')
            ? html.includes(`${selector.slice(1, -1)}>${value}</`)
            : selector.startsWith('.')
              ? html.includes(`class="${selector.slice(1)}"`) && html.includes(value)
              : html.includes(`<${selector}>${value}</${selector}>`);
          async function main() {
            const base = process.env.LIVE_URL.replace(/\/$/, '');
            const expected = { generation: Number(process.env.TARGET_GENERATION), parentGeneration: Number(process.env.PARENT_GENERATION), seed: process.env.GENERATION_SEED, missionId: process.env.MISSION_ID };
            const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const deadline = Date.now() + 240_000;
            async function probe() {
              const nonce = `${Date.now()}-${Math.random()}`;
              const markerResponse = await fetch(`${base}/version.json?nonce=${nonce}`, { cache: 'no-store' });
              if (!markerResponse.ok) return false;
              const marker = await markerResponse.json();
              if (marker.version !== 'evolving' || marker.generation !== expected.generation || marker.parent_generation !== expected.parentGeneration || marker.seed !== expected.seed || marker.mission_id !== expected.missionId) return false;
              const response = await fetch(`${base}/?nonce=${nonce}`, { cache: 'no-store' });
              if (!response.ok) return false;
              const html = await response.text();
              return marker.schema_version === 3
                && crypto.createHash('sha256').update(html).digest('hex') === marker.html_sha256
                && html.includes(`name="polygraph-generation" content="${expected.generation}"`)
                && selectorContains(html, marker.anchors.product_code, marker.invariants.product_code)
                && selectorContains(html, marker.anchors.title, 'Aster QuietWave Wireless Noise-Cancelling Headphones, 40-hour Battery, Midnight Blue')
                && selectorContains(html, marker.anchors.price, marker.invariants.price.symbol + marker.invariants.price.value.toFixed(2))
                && html.includes('class="stock-status"');
            }
            while (Date.now() < deadline) { try { if (await probe()) return; } catch (error) { console.log(`Waiting for Vercel: ${error.message}`); } await pause(3_000); }
            throw new Error(`Vercel did not prove generation ${expected.generation} before timeout`);
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE
