name: switch-version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target fixture version to publish"
        required: true
        default: v1
        type: choice
        options:
          - v1
          - v2
      generation:
        description: "Generation number (auto if omitted)"
        required: false
        default: "auto"

jobs:
  switch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Validate version input
        run: |
          if [[ "${{ inputs.version }}" != "v1" && "${{ inputs.version }}" != "v2" ]]; then
            echo "Unsupported version: ${{ inputs.version }}"
            exit 1
          fi

      - name: Sync fixture index and version manifest
        id: sync
        env:
          TARGET_VERSION: ${{ inputs.version }}
          TARGET_GENERATION: ${{ inputs.generation }}
        run: |
          set -eu
          SOURCE_FILE="versions/${TARGET_VERSION}.html"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "Source file not found: $SOURCE_FILE"
            exit 1
          fi

          cp "$SOURCE_FILE" "index.html"
          ls -la "index.html" "version.json"

          PREV_GEN=0
          if [ -f version.json ]; then
            PREV_GEN=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('version.json','utf8'));process.stdout.write(String(j.generation||0));")
          fi

          if [ "$TARGET_GENERATION" = "auto" ] || [ -z "$TARGET_GENERATION" ]; then
            NEW_GEN=$((PREV_GEN + 1))
          else
            NEW_GEN="$TARGET_GENERATION"
          fi

          export NEW_GEN
          export SRC_SHA=$(git rev-parse HEAD:${SOURCE_FILE})
          export NOW=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          export COMMITS=$(node -e "const child_process=require('child_process');const raw=child_process.execSync('git log --pretty=format:%H -n 5').toString().trim();process.stdout.write(JSON.stringify(raw?raw.split('\\n').filter(Boolean):[]));")
          NODE_ENV=production node - <<'EOF'
            const fs=require('fs');
            const manifest = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            manifest.version = process.env.TARGET_VERSION;
            manifest.generation = Number(process.env.NEW_GEN);
            manifest.source_sha = process.env.SRC_SHA;
            manifest.published_at = process.env.NOW;
            manifest.source = `versions/${process.env.TARGET_VERSION}.html`;
            manifest.commits = process.env.COMMITS ? JSON.parse(process.env.COMMITS) : [];
            manifest.source_sha = process.env.SRC_SHA || manifest.source_sha;
            manifest.cache = `rev-${manifest.version}-${manifest.generation}`;
            fs.writeFileSync('version.json', JSON.stringify(manifest, null, 2) + '\n');
          EOF
        shell: bash

      - name: Commit and push rotation
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No changes for ${TARGET_VERSION} - skipping push"
            exit 0
          fi
          git commit -m "chore(fixture): switch to ${TARGET_VERSION}"
          git push
